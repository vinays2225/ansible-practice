- name: Check even or odd
  hosts: local
  connection: local
  vars:
    given_number: 10
  tasks:
  - name:  is even 
    debug:
      msg: "given number {{given_number}} is even"
    when: (given_number | int) % 2 == 0

  - name: is odd
    debug:
      msg: "given number {{given_number}} is odd" 
    when: (given_number | int) % 2 != 0    