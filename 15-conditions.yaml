- name: Install Software
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install nginx
    dnf:
      name: nginx
      state: present
    when: (ansible_facts.os_family == "RedHat" ) 

  - name: install ngnix in ubuntu
    apt:
      name: nginx
      state: present
    when: (ansible_facts.os_family == "Debian")   