- name: data types demo
  hosts: local
  connection: local
  vars:
    name1: "Siva"
    age: 30
    is_prasent: true
    price: 300.2
    skills:
    - java
    - aws
    - ansible
    - shell
    more_details: # dictionary/map
      trainer: sivakumar
      months: 4

  tasks:
  - name: print data
    debug:
      msg: |
        name: {{name1}} {{ name1 | type_debug}}
        age: {{age}} {{age | type_debug }}
        isPrasent: {{is_prasent}} {{is_prasent | type_debug}}
        price: {{price}} {{price | type_debug}}
        Skills: {{skills}} {{skills | type_debug}}
        more details: {{ more_details }} : {{ more_details | type_debug }} 