- name: data types demo
  hosts: local
  connection: local
  vars:
    name1: "Siva"
    age: 30
    is_prasent: true
    price: 300.2
    skills:
    - java
    - aws
    - ansible
    - shell
    cloud_skills:
      cloud: aws
      languages: java
      scripting: shell JS react

  tasks:
  - name: print data
    debug:
      msg: |
        name: "{{ name1 | type_debug}}"
        age: "{{age | type_debug }}"
        isPrasent: "{{is_prasent | type_debug}}"
        price: "{{price | type_debug}}"
        Skills: "{{skills | type_debug}}"
        cloud_skills: "{{ cloud_skills | type_debug}}"
