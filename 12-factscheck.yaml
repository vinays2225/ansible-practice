- name: Fact checkinng
  hosts: local
  connection: local
  tasks:
  - name: Facts
    debug:
      msg: "{{ ansible_facts }}"

  - name: display info
    debug:
      msg: |
      OS Family: "{{ ansible_facts.os_family }}"
      Private_IP: "{{ ansible_facts.default_ipv4.address }}"
      private_ip: "{{ ansible_facts['default_ipv4']['address'] }}"
